version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: wordpress_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wordpress_root_pass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_pass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network

  # WordPress Application
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wordpress_site
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_pass
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      # Mount your custom theme
      - ./wp-content/themes/custom-theme:/var/www/html/wp-content/themes/custom-theme
      # Persist WordPress uploads and plugins
      - wordpress_data:/var/www/html/wp-content/uploads
      - wordpress_plugins:/var/www/html/wp-content/plugins
    networks:
      - wordpress_network

  # phpMyAdmin (optional - for database management)
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin:latest
    container_name: wordpress_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: wordpress_root_pass
    networks:
      - wordpress_network

volumes:
  db_data:
  wordpress_data:
  wordpress_plugins:

networks:
  wordpress_network:
    driver: bridge
